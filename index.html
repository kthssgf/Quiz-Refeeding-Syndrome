<h2>Kuis Refeeding Syndrome</h2>
<div id="app"></div>
</div>
<script>
const Q=[
{t:"C1-C2",s:"Refeeding syndrome (RFS) paling tepat didefinisikan sebagai...",o:["Komplikasi metabolik setelah nutrisi dimulai kembali atau ditingkatkan bermakna pada pasien yang sebelumnya kekurangan asupan","Hipoglikemia berat akibat puasa berkepanjangan tanpa pemberian glukosa","Sepsis yang timbul setelah tindakan pembedahan besar","Hiperkalemia akibat transfusi darah berulang","Kelebihan nutrisi yang menyebabkan obesitas dan sindrom metabolik"],w:["Hipoglikemia akibat puasa berkepanjangan adalah kondisi yang berbeda; RFS justru terjadi setelah nutrisi dimulai.","Sepsis pascaoperasi dapat menjadi faktor pencetus, tetapi bukan definisi RFS.","Hiperkalemia akibat transfusi tidak termasuk definisi RFS; RFS ditandai penurunan kalium, bukan kenaikannya.","Kelebihan nutrisi menyebabkan obesitas, sedangkan RFS terjadi pada pasien yang kekurangan gizi."],e:"Refeeding syndrome adalah komplikasi metabolik yang terjadi setelah nutrisi dimulai kembali atau ditingkatkan bermakna pada pasien malnutrisi. Dapat terjadi pada nutrisi oral, enteral, parenteral, maupun dekstrosa intravena, dan melibatkan perubahan fosfat, kalium, magnesium, glukosa, tiamin, serta keseimbangan natrium-air."},
{t:"C1-C2",s:"Mekanisme utama penurunan kadar fosfat serum pada RFS adalah...",o:["Peningkatan insulin setelah karbohidrat diberikan, sehingga fosfat berpindah ke dalam sel","Peningkatan ekskresi fosfat melalui ginjal akibat glukagon","Malabsorpsi fosfat di usus halus yang menetap","Pelepasan fosfat berlebih dari jaringan tulang","Hemolisis eritrosit yang melepaskan fosfat ke sirkulasi"],w:["Peningkatan ekskresi fosfat melalui ginjal akibat glukagon tidak sesuai; glukagon justru menurun saat nutrisi masuk.","Malabsorpsi menetap bukan mekanisme utama RFS; masalah ini menjelaskan penyebab malnutrisi, bukan perpindahan fosfat setelah refeeding.","Pelepasan fosfat dari tulang tidak menjelaskan penurunan serum setelah refeeding.","Hemolisis melepaskan fosfat ke sirkulasi, sehingga berlawanan dengan penurunan kadar serum."],e:"Pemberian karbohidrat meningkatkan insulin, yang mendorong perpindahan fosfat, kalium, dan magnesium ke dalam sel untuk fosforilasi glukosa, sintesis ATP, dan proses anabolik. Akibatnya kadar serum turun cepat, meskipun total tubuh sudah kekurangan."},
{t:"C1-C2",s:"Mengapa kadar elektrolit serum yang masih normal tidak menyingkirkan RFS?",o:["Kadar serum hanya mencerminkan sebagian kecil simpanan tubuh; deplesi intraseluler dapat tersembunyi","Pemeriksaan laboratorium selalu tidak akurat pada pasien malnutrisi","Kadar serum normal berarti tidak ada kekurangan tiamin","RFS hanya terjadi pada pasien dengan kadar serum rendah sejak awal","Kadar fosfat normal berarti tubuh tidak membutuhkan fosfat"],w:["Pemeriksaan laboratorium tidak selalu tidak akurat; masalahnya adalah serum tidak mencerminkan simpanan total tubuh.","Kadar serum normal tidak menjamin tidak adanya defisiensi tiamin, karena tiamin juga cadangannya tersembunyi.","RFS justru dapat terjadi pada pasien dengan kadar awal normal, karena deplesi intraseluler tidak tampak di serum.","Fosfat tetap dibutuhkan untuk ATP dan proses seluler, sehingga kadar normal tidak berarti kebutuhannya hilang."],e:"Saat kelaparan, simpanan intraseluler elektrolit dan tiamin dapat menipis meskipun kadar serum tampak normal. Karena itu nilai awal normal tidak menyingkirkan deplesi total tubuh, dan RFS tetap perlu diwaspadai pada pasien berisiko."},
{t:"C1-C2",s:"Peran tiamin dalam RFS berkaitan dengan...",o:["Kofaktor metabolisme oksidatif karbohidrat, yang kebutuhannya meningkat saat glukosa masuk","Pembentukan sel darah merah dan sintesis hemoglobin","Pengaturan keseimbangan natrium dan air di ginjal","Penghambatan sekresi insulin oleh sel beta pankreas","Pengikatan kalsium pada tulang"],w:["Pembentukan sel darah merah berkaitan dengan vitamin B12 dan asam folat, bukan tiamin.","Keseimbangan natrium dan air diatur oleh hormon aldosteron dan ADH, bukan tiamin.","Tiamin tidak menghambat insulin; justru kebutuhannya meningkat saat insulin dan metabolisme karbohidrat meningkat.","Pengikatan kalsium pada tulang berkaitan dengan vitamin D dan hormon paratiroid, bukan tiamin."],e:"Tiamin adalah kofaktor metabolisme oksidatif karbohidrat. Saat karbohidrat diberikan, kebutuhan tiamin meningkat, sehingga defisiensi dapat memicu asidosis laktat, ensefalopati Wernicke, neuropati, dan gagal jantung."},
{t:"C1-C2",s:"Kondisi yang paling tepat sebagai faktor risiko RFS adalah...",o:["Asupan sangat sedikit atau nihil selama beberapa hari disertai penurunan berat badan","Obesitas dengan asupan makanan normal","Hipertensi yang terkontrol dengan obat","Kehamilan trimester kedua tanpa komplikasi","Aktivitas fisik intensif pada atlet"],w:["Obesitas dengan asupan normal tidak termasuk kondisi kekurangan gizi, sehingga risiko RFS tidak meningkat.","Hipertensi terkontrol tidak termasuk faktor risiko RFS.","Kehamilan trimester kedua tanpa komplikasi tidak menunjukkan kekurangan gizi berat yang menjadi dasar RFS.","Aktivitas fisik intensif tidak menyebabkan kekurangan nutrisi berkepanjangan yang khas pada RFS."],e:"Faktor risiko utama adalah asupan sangat sedikit atau nihil selama beberapa hari, terutama disertai penurunan berat badan. Faktor lain meliputi malnutrisi akut atau kronis, malabsorpsi, muntah atau diare berkepanjangan, kanker, penyakit kronis, dan konsumsi alkohol bermasalah."},
{t:"C1-C2",s:"Pada anoreksia nervosa atau gangguan makan restriktif, BMI yang tidak sangat rendah...",o:["Tidak sepenuhnya menyingkirkan risiko RFS","Menyingkirkan risiko RFS sepenuhnya","Menandakan pasien tidak membutuhkan monitoring elektrolit","Berarti tiamin tidak diperlukan","Menandakan tidak ada deplesi total tubuh"],w:["BMI yang tidak sangat rendah tidak menyingkirkan risiko, karena deplesi tubuh dapat terjadi meskipun BMI tidak ekstrem.","Monitoring elektrolit tetap diperlukan karena BMI tidak menggambarkan simpanan intraseluler.","Tiamin tetap dapat diperlukan pada pasien berisiko, terlepas dari BMI.","BMI tidak menggambarkan status cadangan elektrolit dan tiamin; deplesi total tubuh dapat tersembunyi."],e:"Gangguan makan restriktif dapat menyebabkan RFS meskipun BMI tidak sangat rendah. Penilaian risiko harus memperhitungkan durasi asupan rendah, penurunan berat badan, dan penyakit penyerta, bukan BMI saja."},
{t:"C1-C2",s:"Pada ASPEN 2020, penilaian perubahan elektrolit untuk menentukan derajat RFS dilakukan dalam jendela waktu...",o:["5 hari setelah energi dimulai atau ditingkatkan","24 jam setelah energi dimulai","72 jam setelah energi mencapai target","7 hari setelah energi dimulai","10 hari setelah energi dimulai"],w:["24 jam terlalu singkat untuk menilai perubahan elektrolit menurut kriteria ASPEN 2020.","72 jam adalah jendela waktu pada kriteria AuSPEN 2025, bukan ASPEN 2020.","7 hari terlalu panjang; ASPEN menggunakan jendela lima hari.","10 hari tidak termasuk dalam kriteria ASPEN 2020 untuk penilaian derajat RFS."],e:"ASPEN 2020 mengklasifikasikan RFS berdasarkan persentase penurunan fosfat, kalium, dan/atau magnesium dalam lima hari setelah energi dimulai atau ditingkatkan kembali, dengan membandingkan terhadap baseline."},
{t:"C1-C2",s:"Menurut ASPEN 2020, RFS berat ditandai oleh...",o:["Penurunan elektrolit >30% dan/atau disfungsi organ akibat perubahan elektrolit atau defisiensi tiamin","Penurunan elektrolit 10-20% tanpa gejala","Penurunan elektrolit 20-30% pada satu elektrolit saja","Kadar elektrolit yang tetap normal selama lima hari","Kenaikan berat badan lebih dari 1 kg dalam sehari"],w:["Penurunan 10-20% tanpa gejala termasuk derajat ringan, bukan berat.","Penurunan 20-30% pada satu atau lebih elektrolit termasuk derajat sedang.","Kadar elektrolit yang normal tidak menunjukkan RFS, sehingga tidak termasuk derajat berat.","Kenaikan berat badan cepat dapat mencerminkan retensi cairan, bukan kriteria derajat RFS."],e:"Derajat berat menurut ASPEN 2020 adalah penurunan elektrolit lebih dari 30% dan/atau disfungsi organ akibat perubahan elektrolit atau defisiensi tiamin. Kondisi ini memerlukan respons klinis segera."},
{t:"C1-C2",s:"Konsensus AuSPEN 2025 berbeda dari ASPEN 2020 karena...",o:["Khusus untuk pasien dewasa dan menekankan diagnosis klinis dengan kombinasi asupan, penurunan fosfat, dan gejala","Berlaku untuk anak dan dewasa dengan kriteria yang sama","Hanya menilai kadar kalium tanpa memperhatikan fosfat","Tidak menyebutkan kriteria asupan sama sekali","Menggunakan jendela waktu 5 hari"],w:["Konsensus AuSPEN 2025 tidak berlaku untuk anak, sehingga tidak tepat dijadikan dasar tatalaksana pediatri.","AuSPEN 2025 tidak menyamakan kriteria anak dan dewasa; konsensus ini khusus dewasa.","AuSPEN 2025 menekankan fosfat sebagai biomarker utama, bukan kalium saja.","AuSPEN 2025 menyebutkan asupan ≥50% kebutuhan estimasi sebagai bagian dari kriteria."],e:"AuSPEN 2025 khusus untuk dewasa dan menekankan diagnosis klinis yang menggabungkan kecukupan asupan, penurunan fosfat, dan gejala klinis. Jendela waktunya adalah 72 jam setelah mencapai ≥50% kebutuhan, berbeda dari lima hari pada ASPEN 2020."},
{t:"C1-C2",s:"Dosis tiamin yang dianjurkan ASPEN 2020 pada anak berisiko RFS adalah sekitar...",o:["2 mg/kg (maksimum 100-200 mg/hari) sebelum nutrisi atau dekstrosa","10 mg/kg per hari tanpa batas maksimum","50 mg sekali pemberian tanpa perlu diulang","0,1 mg/kg per hari","500 mg per hari selama satu bulan"],w:["10 mg/kg per hari melampaui dosis yang dianjurkan dan tidak memiliki batas maksimum yang sesuai.","Dosis tunggal 50 mg tidak sesuai dengan anjuran lanjutan selama 5-7 hari atau lebih pada risiko tinggi.","0,1 mg/kg terlalu rendah untuk anak berisiko dan tidak sesuai rekomendasi.","500 mg per hari melampaui dosis yang dianjurkan untuk anak dan tidak sesuai dengan durasi pemberian."],e:"Pada anak berisiko, tiamin sekitar 2 mg/kg diberikan sebelum nutrisi atau dekstrosa dengan maksimum 100-200 mg/hari, dilanjutkan 5-7 hari atau lebih bila risiko tinggi atau dicurigai defisiensi. Pada dewasa, AuSPEN 2025 menganjurkan tiamin sebelum nutrisi dan selama 7-10 hari."},
{t:"C1-C2",s:"Indikasi pemeriksaan EKG pada RFS adalah...",o:["Gangguan elektrolit bermakna, gejala kardiovaskular, atau risiko aritmia","Dilakukan rutin pada semua pasien sebelum nutrisi","Dilakukan hanya setelah satu bulan terapi","Dilakukan hanya bila glukosa darah tinggi","Dilakukan hanya setelah pasien mengalami kejang"],w:["Pemeriksaan EKG rutin pada semua pasien tidak diperlukan; indikasinya lebih spesifik.","Menunggu satu bulan terlalu lama, karena risiko aritmia dapat muncul dalam hari-hari awal.","Glukosa darah tinggi bukan indikasi utama EKG dalam konteks RFS.","EKG tidak boleh ditunda sampai kejang terjadi; pemeriksaan dilakukan berdasarkan risiko."],e:"Pemeriksaan EKG dilakukan bila terdapat gangguan elektrolit bermakna, gejala kardiovaskular, atau risiko aritmia, karena hipofosfatemia, hipokalemia, dan hipomagnesemia dapat memicu aritmia. Hal ini membantu mendeteksi perubahan sebelum gejala berat muncul."},
{t:"C1-C2",s:"ASPEN menyarankan pada pasien berisiko tinggi, pemeriksaan elektrolit dilakukan setiap...",o:["12 jam selama tiga hari pertama","24 jam selama tujuh hari","6 jam selama satu hari","48 jam selama satu minggu","Seminggu sekali"],w:["Pemeriksaan setiap 24 jam selama tujuh hari terlalu jarang untuk fase awal RFS pada risiko tinggi.","Setiap 6 jam hanya selama satu hari tidak sesuai dengan rekomendasi pemantauan tiga hari pertama.","Setiap 48 jam selama satu minggu terlalu jarang pada fase awal yang paling berisiko.","Pemeriksaan seminggu sekali tidak memadai untuk mendeteksi perubahan cepat pada RFS."],e:"Pada pasien risiko tinggi, ASPEN menyarankan pemeriksaan fosfat, kalium, dan magnesium setiap 12 jam selama tiga hari pertama, karena perubahan elektrolit terjadi cepat setelah nutrisi dimulai. Frekuensi selanjutnya disesuaikan tren dan respons klinis."},
{t:"C1-C2",s:"Pada hipofosfatemia berat, gangguan otot napas dapat terjadi karena...",o:["Penurunan ATP dan 2,3-DPG, sehingga kelemahan otot napas dan pelepasan oksigen terganggu","Peningkatan produksi surfaktan paru","Kelebihan kalium yang menekan pusat napas","Kenaikan kadar natrium yang menyebabkan bronkospasme","Penurunan tekanan darah sistemik yang berdiri sendiri"],w:["Peningkatan surfaktan paru tidak menjelaskan kelemahan otot napas pada hipofosfatemia.","Kelebihan kalium justru berhubungan dengan hiperkalemia, bukan kelemahan otot napas khas RFS.","Kenaikan natrium tidak menyebabkan bronkospasme pada mekanisme RFS.","Penurunan tekanan darah dapat terjadi, tetapi bukan penyebab langsung kelemahan otot napas pada mekanisme ini."],e:"Fosfat diperlukan untuk ATP dan 2,3-DPG eritrosit. Hipofosfatemia menurunkan ATP dan 2,3-DPG, sehingga oksigen sulit dilepaskan ke jaringan, dan fungsi otot, termasuk otot napas, melemah. Akibatnya dapat terjadi hipoksia dan gagal napas."},
{t:"C1-C2",s:"Pada dewasa dengan risiko RFS, pemberian energi awal sering dirujuk ASPEN 2020 sekitar...",o:["10-20 kkal/kg atau 100-150 g dekstrosa dalam 24 jam pertama","30-40 kkal/kg dalam 24 jam pertama","50-60 kkal/kg dalam 24 jam pertama","5 kkal/kg dalam 24 jam pertama","2000 kkal tetap sejak hari pertama"],w:["30-40 kkal/kg terlalu tinggi untuk fase awal pada pasien berisiko tinggi, sehingga meningkatkan risiko RFS.","50-60 kkal/kg jauh melampaui rekomendasi awal dan berisiko besar menimbulkan RFS.","5 kkal/kg terlalu rendah dan tidak memenuhi kebutuhan awal yang dirujuk ASPEN.","Angka tetap 2000 kkal tidak mempertimbangkan kebutuhan individual dan tidak sesuai dengan pendekatan bertahap."],e:"ASPEN 2020 sering dirujuk untuk memulai sekitar 10-20 kkal/kg atau 100-150 g dekstrosa pada 24 jam pertama pada dewasa berisiko. Ini merupakan panduan konsensus, bukan resep universal, dan harus disesuaikan dengan kondisi pasien serta pemantauan."},
{t:"C1-C2",s:"Pada malnutrisi akut berat anak, pendekatan tatalaksana nutrisi yang tepat adalah...",o:["Protokol pediatri khusus dengan fase stabilisasi, transisi, dan rehabilitasi","Langsung memberikan energi dewasa 20 kkal/kg sejak hari pertama","Memberikan dekstrosa dosis maksimal untuk mempercepat pemulihan","Pembatasan cairan total tanpa memperhatikan kondisi","Nutrisi penuh sejak jam pertama tanpa monitoring"],w:["Energi dewasa langsung diterapkan pada anak tidak sesuai, karena kebutuhan dan protokol anak berbeda.","Dekstrosa maksimal berisiko memicu pergeseran elektrolit dan hiperglikemia, sehingga tidak tepat.","Pembatasan cairan total tidak dianjurkan secara otomatis; kebutuhan cairan dinilai berdasarkan kondisi.","Nutrisi penuh tanpa monitoring meningkatkan risiko RFS pada anak malnutrisi berat."],e:"Pada malnutrisi akut berat anak, digunakan protokol pediatri dengan fase stabilisasi, transisi, dan rehabilitasi. Angka dewasa tidak boleh diterapkan langsung pada anak, dan pemberian energi harus bertahap sesuai usia dan kondisi."},
{t:"C3-C4",s:"Pria 48 tahun dirawat karena penurunan berat badan signifikan dan asupan sangat sedikit selama 10 hari akibat penyakit gastrointestinal. Nutrisi enteral dimulai. Pada hari ketiga ia lemas, tampak edema kedua tungkai, dan fosfat turun bermakna dibanding sebelum nutrisi, disertai kalium dan magnesium yang turun. Diagnosis yang paling tepat adalah...",o:["Refeeding syndrome","Sepsis dengan hipofosfatemia primer","Gagal jantung kongestif murni","Hipoalbuminemia tanpa gangguan elektrolit","Hiperglikemia akibat nutrisi enteral"],w:["Sepsis dapat menyebabkan gangguan elektrolit, tetapi tidak menjelaskan hubungan waktu dengan dimulainya nutrisi pada pasien kekurangan asupan.","Gagal jantung murni tidak menjelaskan penurunan fosfat, kalium, dan magnesium secara bersamaan setelah nutrisi dimulai.","Hipoalbuminemia tidak menyebabkan penurunan elektrolit yang bermakna dan khas seperti ini.","Hiperglikemia tidak sesuai dengan gambaran penurunan elektrolit dan edema pada konteks ini."],e:"Diagnosis RFS didukung oleh riwayat asupan sangat rendah, hubungan waktu dengan dimulainya nutrisi, penurunan fosfat, kalium, dan magnesium, serta gejala berupa lemas dan edema. Evaluasi penyebab lain tetap dilakukan sebelum menegakkan diagnosis."},
{t:"C3-C4",s:"Anak laki-laki 3 tahun dengan malnutrisi akut berat mendapat terapi nutrisi. Pada hari kedua ia letargi, frekuensi napas meningkat, dan fosfat turun dibanding nilai awal. Tindakan awal yang paling tepat adalah...",o:["Stabilisasi ABC, periksa fosfat, kalium, magnesium, glukosa, natrium, ureum, kreatinin, dan EKG, lalu koreksi terukur dan tinjau ulang energi serta dekstrosa","Lanjutkan energi penuh dan tambah cairan tanpa evaluasi","Tunggu hasil laboratorium satu minggu sebelum bertindak","Berikan dekstrosa konsentrasi tinggi untuk mengatasi letargi","Hentikan tiamin untuk mengurangi beban metabolik"],w:["Melanjutkan energi penuh tanpa evaluasi berisiko memperberat RFS dan tidak sesuai dengan tatalaksana bertahap.","Menunggu satu minggu tidak sesuai, karena tanda bahaya RFS memerlukan stabilisasi segera tanpa menunggu semua hasil.","Dekstrosa konsentrasi tinggi dapat memperberat pergeseran elektrolit dan tidak mengatasi penyebab RFS.","Tiamin justru dibutuhkan pada RFS, sehingga menghentikannya tidak tepat."],e:"Letargi, takipnea, dan penurunan fosfat merupakan tanda bahaya RFS. Tindakan awal berupa stabilisasi ABC dan pemeriksaan elektrolit serta EKG. Koreksi dilakukan terukur, energi dan dekstrosa ditinjau, dan bila elektrolit turun tajam, kalori dapat dikurangi sekitar 50% sambil eskalasi perawatan."},
{t:"C3-C4",s:"Perempuan 22 tahun dirawat dengan gangguan makan restriktif, asupan sangat sedikit selama 8 hari, berat badan turun bermakna, tanpa edema dan tanpa gangguan irama. Fosfat, kalium, dan magnesium masih dalam rentang rujukan. Persiapan yang paling tepat sebelum nutrisi dimulai adalah...",o:["Baseline elektrolit, glukosa, dan fungsi ginjal; tiamin sebelum atau saat awal; rencana energi bertahap; koreksi elektrolit sesuai derajat; jadwal pemantauan ketat","Langsung memberikan energi penuh karena elektrolit normal","Tidak memberikan tiamin karena pasien tidak memiliki tanda defisiensi","Menunda pemeriksaan laboratorium sampai pasien stabil","Memberikan nutrisi hanya setelah kenaikan berat badan 5 kg"],w:["Energi penuh langsung berisiko tinggi memicu RFS, karena elektrolit normal awal tidak menyingkirkan deplesi tubuh.","Tiamin dianjurkan pada pasien berisiko sebelum atau saat awal nutrisi, walaupun tanpa tanda defisiensi nyata.","Pemeriksaan laboratorium perlu dilakukan sebelum memulai nutrisi sebagai baseline, bukan ditunda.","Kenaikan berat badan 5 kg tidak menjadi syarat nutrisi; nutrisi dimulai bertahap dengan persiapan sesuai risiko."],e:"Pencegahan dimulai sebelum kalori pertama diberikan. Pasien berisiko memerlukan baseline elektrolit, glukosa, dan fungsi ginjal, pemberian tiamin, rencana energi awal dan laju peningkatannya, koreksi elektrolit sesuai derajat, serta jadwal pemantauan. Hal ini penting karena nilai awal normal tidak menyingkirkan deplesi total tubuh."},
{t:"C3-C4",s:"Menurut AuSPEN 2025 pada dewasa berisiko RFS, tiamin dan multivitamin dianjurkan sebagai berikut...",o:["Tiamin sebelum nutrisi dan dilanjutkan 7-10 hari; multivitamin selama 10 hari","Tiamin satu dosis saja tanpa pengulangan","Tiamin selama dua hari saja","Tiamin selama 30 hari tanpa pemantauan","Tidak perlu tiamin bila pasien tidak mengalami ensefalopati"],w:["Pemberian tiamin satu dosis saja tidak cukup menurut AuSPEN untuk pasien berisiko.","Durasi dua hari terlalu pendek dibanding anjuran 7-10 hari.","Durasi 30 hari tanpa pemantauan tidak sesuai dengan anjuran; dosis dan durasi mengikuti protokol dan kondisi klinis.","Tiamin diberikan sebagai pencegahan, sehingga tidak perlu menunggu ensefalopati untuk memulainya."],e:"AuSPEN 2025 menganjurkan tiamin sebelum nutrisi dan dilanjutkan selama 7-10 hari, serta multivitamin selama 10 hari. Dosis dan rute tetap mengikuti protokol, kondisi klinis, dan dugaan defisiensi. Pada dugaan ensefalopati Wernicke, tatalaksana harus segera dilakukan."},
{t:"C3-C4",s:"Kriteria biokimia AuSPEN 2025 untuk RFS pada dewasa adalah...",o:["Penurunan fosfat ≥30% dari baseline dalam 72 jam setelah pasien mencapai ≥50% kebutuhan nutrisi estimasi, tanpa penyebab lain dan disertai gejala konsisten","Penurunan fosfat 10-20% dalam 5 hari tanpa gejala","Penurunan fosfat 20-30% dalam 24 jam saja","Penurunan elektrolit lebih dari 50% dalam satu minggu","Setiap penurunan elektrolit tanpa memperhatikan asupan"],w:["Penurunan 10-20% dalam 5 hari tanpa gejala termasuk kriteria ASPEN ringan, bukan AuSPEN.","Penurunan 20-30% dalam 24 jam tidak sesuai dengan jendela waktu AuSPEN 72 jam.","Penurunan >50% dalam satu minggu tidak sesuai dengan kriteria AuSPEN yang menekankan fosfat dalam 72 jam.","AuSPEN tidak menilai penurunan tanpa memperhatikan asupan dan gejala; kriteria ini memerlukan konteks klinis."],e:"AuSPEN 2025 menilai RFS dewasa berdasarkan penurunan fosfat ≥30% dari baseline dalam 72 jam setelah pasien mencapai ≥50% kebutuhan estimasi selama 24 jam. Penurunan tidak boleh dijelaskan penyebab lain dan harus disertai gejala klinis yang konsisten."},
{t:"C3-C4",s:"Pada RFS, bila kadar elektrolit turun tajam atau sulit dikoreksi, ASPEN 2020 menganjurkan...",o:["Pertimbangkan pengurangan kalori atau dekstrosa sekitar 50%, lalu tingkatkan bertahap sesuai respons","Hentikan nutrisi secara permanen","Gandakan kalori untuk mempercepat pemulihan","Abaikan perubahan elektrolit selama pasien masih sadar","Berikan bolus fosfat dosis tinggi tanpa pemantauan"],w:["Menghentikan nutrisi secara permanen tidak dianjurkan; kebutuhan nutrisi tetap dipenuhi secara bertahap.","Menggandakan kalori justru memperberat pergeseran elektrolit dan risiko RFS.","Mengabaikan elektrolit yang turun tajam berisiko menyebabkan aritmia dan gagal napas.","Bolus fosfat dosis tinggi tanpa pemantauan berisiko komplikasi dan tidak sesuai dengan prinsip koreksi terukur."],e:"Bila elektrolit turun tajam atau sulit dikoreksi, ASPEN menganjurkan pertimbangan pengurangan kalori atau dekstrosa sekitar 50%, dengan peningkatan bertahap sesuai respons. Keputusan ini dibuat tim klinis dan tidak boleh menunda stabilisasi."},
{t:"C3-C4",s:"Dalam evaluasi diagnosis RFS, pendekatan yang paling tepat adalah...",o:["Mengintegrasikan riwayat asupan, hubungan waktu, tren laboratorium, gejala klinis, dan menyingkirkan diagnosis banding","Menegakkan RFS dari satu nilai fosfat rendah saja","Menganggap semua penurunan elektrolit sebagai RFS","Menunda diagnosis sampai gejala neurologis muncul","Menggunakan BMI sebagai satu-satunya dasar diagnosis"],w:["Menegakkan RFS dari satu nilai fosfat saja tidak tepat, karena diagnosis memerlukan konteks klinis dan tren.","Semua penurunan elektrolit tidak otomatis RFS; penyebab lain seperti sepsis atau gagal ginjal harus disingkirkan.","Menunda diagnosis sampai gejala neurologis berat berbahaya; tanda awal perlu dinilai sejak awal.","BMI tidak cukup menggambarkan risiko dan status elektrolit; BMI hanya sebagian dari penilaian."],e:"Diagnosis RFS menggabungkan riwayat kekurangan nutrisi, hubungan waktu dengan dimulainya atau naiknya asupan, tren fosfat, kalium, magnesium, dan glukosa, gejala klinis, serta evaluasi penyebab alternatif. Satu hasil laboratorium tidak cukup untuk menyimpulkan RFS."},
{t:"C3-C4",s:"Pada pasien RFS yang mengalami kenaikan berat badan cepat dan edema, pengelolaan cairan yang tepat adalah...",o:["Tinjau total cairan termasuk intravena, formula, dan obat; pantau masukan-keluaran, edema, dan berat badan tanpa membatasi cairan atau natrium secara otomatis","Batasi natrium dan cairan secara total pada semua pasien","Abaikan edema karena merupakan tanda pemulihan jaringan","Berikan diuretik tanpa menilai fungsi jantung dan ginjal","Tingkatkan cairan intravena untuk mengatasi edema"],w:["Pembatasan cairan dan natrium total secara otomatis tidak dianjurkan; kebutuhan dinilai berdasarkan kondisi pasien.","Edema bukan tanda pemulihan jaringan; kenaikan berat badan cepat sering mencerminkan retensi cairan.","Diuretik perlu diberikan berdasarkan penilaian fungsi jantung dan ginjal, bukan secara otomatis.","Menambah cairan intravena pada pasien yang sudah edema dapat memperberat kongesti."],e:"Kenaikan berat badan cepat dapat mencerminkan retensi cairan, bukan hanya pemulihan jaringan. Tinjau seluruh sumber cairan, pantau masukan-keluaran, edema, berat badan, dan tanda kongesti. Cairan atau natrium tidak dibatasi otomatis, tetapi disesuaikan dengan kondisi klinis."},
{t:"C3-C4",s:"Pada pasien RFS yang mendapat dekstrosa intravena, parameter yang harus dipantau bersamaan selain fosfat, kalium, dan magnesium adalah...",o:["Glukosa darah untuk mendeteksi hipo- atau hiperglikemia sesuai kondisi dan terapi","Kadar hemoglobin setiap jam","Kadar albumin serum setiap hari","Kadar kolesterol total","Kadar bilirubin direk setiap 12 jam"],w:["Hemoglobin tidak menjadi parameter utama RFS yang perlu dipantau setiap jam.","Albumin bukan parameter utama pemantauan RFS harian.","Kolesterol total tidak relevan untuk pemantauan RFS pada fase awal.","Bilirubin direk tidak menjadi parameter rutin pemantauan RFS."],e:"Pada RFS, dekstrosa intravena dapat mengubah kadar glukosa, sehingga glukosa perlu dipantau untuk mendeteksi hipo- atau hiperglikemia. Pemantauan ini dilakukan bersama fosfat, kalium, magnesium, natrium, dan fungsi ginjal, serta disesuaikan dengan protokol."},
{t:"C3-C4",s:"Mengapa koreksi magnesium penting pada pasien dengan hipokalemia akibat RFS?",o:["Magnesium diperlukan untuk homeostasis kalium; defisiensi magnesium membuat hipokalemia sulit dikoreksi dan meningkatkan risiko aritmia","Magnesium meningkatkan ekskresi kalium melalui ginjal","Magnesium menurunkan kadar fosfat sehingga hipofosfatemia membaik","Magnesium langsung menggantikan tiamin pada metabolisme karbohidrat","Magnesium tidak berpengaruh pada aritmia"],w:["Magnesium tidak meningkatkan ekskresi kalium; justru membantu mempertahankan kalium di dalam sel.","Magnesium tidak menurunkan fosfat; keduanya memiliki peran fisiologis berbeda.","Magnesium tidak menggantikan tiamin; keduanya berperan dalam metabolisme yang berbeda.","Magnesium berpengaruh pada aritmia, karena defisiensinya dapat memicu gangguan irama jantung."],e:"Magnesium merupakan kofaktor enzim dan diperlukan untuk homeostasis kalium. Defisiensi magnesium menyebabkan kalium sulit dipertahankan dan membuat hipokalemia sulit dikoreksi. Defisiensi juga dapat memicu aritmia, tremor, tetani, dan kejang, sehingga koreksi magnesium perlu dilakukan bersamaan."},
{t:"C3-C4",s:"Manakah yang termasuk tanda bahaya RFS yang memerlukan stabilisasi segera tanpa menunggu semua hasil laboratorium?",o:["Aritmia, hipotensi atau syok, dan kejang atau penurunan kesadaran","Kenaikan berat badan 1 kg dalam sehari","Nafsu makan yang membaik","Kadar glukosa 120 mg/dL tanpa gejala","Fosfat sedikit di bawah rentang tanpa gejala"],w:["Kenaikan berat badan 1 kg dalam sehari tidak otomatis menjadi tanda bahaya; perlu dinilai apakah berhubungan dengan retensi cairan.","Nafsu makan yang membaik menunjukkan respons yang baik, bukan tanda bahaya.","Glukosa 120 mg/dL tanpa gejala tidak termasuk tanda bahaya RFS.","Fosfat sedikit di bawah rentang tanpa gejala perlu dipantau, tetapi tidak otomatis memerlukan stabilisasi segera."],e:"Tanda bahaya RFS meliputi aritmia, hipotensi atau syok, hipoksia atau edema paru, kejang atau penurunan kesadaran, dan penurunan elektrolit yang berat atau cepat. Pada kondisi ini pasien perlu stabilisasi segera tanpa menunggu semua hasil laboratorium."},
{t:"C3-C4",s:"Perbedaan penting dalam penilaian dan pedoman RFS pada anak dibanding dewasa adalah...",o:["Pada anak digunakan kurva pertumbuhan dan BB terhadap PB atau TB sesuai usia; ASPEN dapat digunakan dengan rujukan usia, sedangkan AuSPEN bukan pedoman anak","Pada anak cukup menggunakan BMI dewasa tanpa rujukan usia","Anak tidak memerlukan pemantauan elektrolit","AuSPEN 2025 berlaku langsung untuk anak dengan malnutrisi berat","Anak selalu menerima energi dewasa karena protokol sama"],w:["Penggunaan BMI dewasa pada anak tidak tepat karena penilaian pertumbuhan anak memerlukan rujukan usia dan jenis kelamin.","Anak justru berisiko tinggi dan memerlukan pemantauan elektrolit yang cermat.","AuSPEN 2025 bukan pedoman anak dan tidak boleh diterapkan langsung pada anak.","Protokol anak berbeda dari dewasa, sehingga angka energi dewasa tidak boleh diterapkan langsung."],e:"Pada anak, penilaian gizi menggunakan kurva pertumbuhan dan indikator seperti BB terhadap PB atau TB sesuai usia. ASPEN 2020 mencakup pediatri dengan rujukan usia, sedangkan AuSPEN 2025 khusus untuk dewasa. Pada malnutrisi akut berat anak, protokol pediatri khusus harus digunakan."},
{t:"C3-C4",s:"Menurut AuSPEN 2025, contoh indikator risiko RFS pada dewasa yang sering digunakan dalam skrining adalah...",o:["Penurunan berat badan >10% dalam 3 bulan atau malnutrisi sedang-berat, asupan terbatas ≥7 hari, alkohol bermasalah, atau kehilangan GI","Tinggi badan di atas persentil 90 tanpa gejala","Tekanan darah sistolik di atas 130 mmHg tanpa penurunan berat badan","Konsumsi serat tinggi dalam diet seimbang","Olahraga rutin lebih dari 150 menit per minggu"],w:["Tinggi badan di atas persentil 90 tidak termasuk indikator risiko RFS dalam skrining AuSPEN.","Tekanan darah sistolik tinggi tanpa penurunan berat badan tidak termasuk indikator utama RFS.","Konsumsi serat tinggi dalam diet seimbang tidak meningkatkan risiko RFS.","Olahraga rutin tidak termasuk indikator risiko RFS; aktivitas fisik bukan faktor risiko utama."],e:"AuSPEN 2025 menggunakan indikator seperti penurunan berat badan >10% dalam 3 bulan atau malnutrisi sedang-berat, asupan terbatas ≥7 hari, alkohol bermasalah, dan kehilangan GI. Umumnya diperlukan ≥2 faktor, dan ini hanya ringkasan; pedoman lengkap tetap digunakan."},
{t:"C3-C4",s:"Setelah tanda RFS muncul pada pasien yang sedang menerima nutrisi, langkah algoritma yang tepat adalah...",o:["Evaluasi penyebab lain, koreksi elektrolit, dan tinjau energi, dekstrosa, serta cairan; bila ada disfungsi organ lakukan stabilisasi dan eskalasi perawatan","Lanjutkan energi penuh karena pasien sedang membaik","Tunda koreksi elektrolit sampai hari ketujuh","Kurangi tiamin untuk menghindari efek samping","Lakukan biopsi jaringan sebelum tindakan apa pun"],w:["Melanjutkan energi penuh tanpa evaluasi berisiko memperberat RFS dan tidak sesuai algoritma.","Menunda koreksi elektrolit sampai hari ketujuh berbahaya, karena perubahan dapat berlangsung cepat dan mengancam jiwa.","Mengurangi tiamin tidak sesuai, karena tiamin dibutuhkan pada RFS untuk mencegah defisiensi.","Biopsi jaringan tidak termasuk langkah awal algoritma RFS dan tidak diperlukan untuk tatalaksana segera."],e:"Algoritma ringkas meliputi evaluasi penyebab lain bila elektrolit turun atau muncul gejala, koreksi, dan peninjauan energi, dekstrosa, serta cairan. Bila ada disfungsi organ, dilakukan stabilisasi segera dan eskalasi perawatan. Setelah stabil, nutrisi ditingkatkan menuju target dengan dokumentasi respons."}
];
const $=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const L="ABCDE";
let order=[],i=0,score=0,lv={};
function start(){
  order=sh(Q).map(q=>({q,o:sh(q.o.map((t,k)=>({t,c:k===0,r:k===0?"":q.w[k-1]})))}));
  i=0;score=0;lv={"C1-C2":[0,0],"C3-C4":[0,0]};show();
}
function show(){
  const app=document.getElementById('app');app.innerHTML='';
  if(i>=order.length){
    const c=$('div','card');
    c.append($('h3',null,'Hasil: '+score+' / '+order.length+' benar'));
    for(const k in lv)c.append($('p',null,k+': '+lv[k][0]+' / '+lv[k][1]+' benar'));
    const b=$('button','btn','Acak & Mulai Ulang');b.onclick=start;c.append(b);
    app.append(c);return;
  }
  const it=order[i];
  const pb=$('div','bar');const d=$('div');d.style.width=(i/order.length*100)+'%';pb.append(d);app.append(pb);
  const card=$('div','card');
  card.append($('p','tag','Soal '+(i+1)+' / '+order.length+'  ·  '+it.q.t));
  card.append($('p','stem',it.q.s));
  const btns=it.o.map((o,k)=>{
    const b=$('button','opt',L[k]+'. '+o.t);
    b.onclick=()=>pick(b,o,k);card.append(b);return b;
  });
  function pick(b,o,k){
    if(btns[0].disabled)return;
    btns.forEach(x=>x.disabled=true);
    lv[it.q.t][1]++;
    if(o.c){score++;lv[it.q.t][0]++;b.classList.add('ok');}
    else{b.classList.add('bad');btns[it.o.findIndex(x=>x.c)].classList.add('ok');}
    const ex=$('div','exp');
    const ci=it.o.findIndex(x=>x.c);
    ex.append($('p',null,'Jawaban benar: '+L[ci]+'. '+it.o[ci].t));
    ex.append($('p',null,it.q.e));
    ex.append($('h4',null,'Mengapa opsi lain tidak tepat:'));
    const ul=$('ul');
    it.o.forEach((x,j)=>{if(!x.c)ul.append($('li',null,L[j]+'. '+x.t+' → '+x.r));});
    ex.append(ul);
    card.append(ex);
    const nb=$('button','btn',i+1<order.length?'Soal Berikutnya':'Lihat Hasil');
    nb.onclick=()=>{i++;show();};card.append(nb);
  }
  app.append(card);
}
start();
</script>
